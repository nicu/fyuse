<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fyuse viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    .loading {
      margin: 16px;
      font-size: 18px;
    }

    #debug {
      margin: 8px 16px;
      font-size: 12px;
      color: #666;
      min-height: 1em;
    }

    #fyuse {
      position: relative;
      width: min(100vw, 600px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid gray;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;        /* stop the browser stealing touch drags for scrolling */
      cursor: ew-resize;
    }

    #fyuse img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: block;
      visibility: hidden;        /* visibility (not display) keeps decoded images ready to paint */
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #fyuse img.visible {
      visibility: visible;
    }

    #enable-tilt {
      display: none;
      margin: 16px auto;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #888;
      background: #f3f3f3;
    }
  </style>
</head>
<body>
  <h1 class="loading">Loading…</h1>
  <div id="debug"></div>
  <div id="fyuse"></div>
  <button id="enable-tilt" type="button">Enable tilt control</button>

  <script src="app.js"></script>
</body>
</html>
